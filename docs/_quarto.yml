# Quarto build of the DD102 docs (replacing Docsify's index.html,
# _sidebar.md and _navbar.md).
#
#   quarto preview docs          # live site at http://localhost:4200
#   quarto render docs           # site in docs/_site, with a PDF of every page
#   quarto render docs --profile pdf --to typst
#                                # the whole course as one PDF in docs/_book
#
# The sidebar follows the Course path order on the home page.

project:
  type: website
  output-dir: _site
  # quarto preview docs serves the site here (otherwise Quarto picks a random port).
  preview:
    port: 4200
    browser: false
  resources:
    - assets/img/carry-travels.web.mp4

website:
  title: "DD102 — Digital Logic & FPGAs"
  description: "Draw a circuit, transcribe it to SystemVerilog, and run it on an FPGA."
  site-url: https://uoftasic.com/dd102/
  repo-url: https://github.com/uoftasic/dd102
  repo-subdir: docs
  repo-actions: [issue]
  search: true
  page-navigation: true
  navbar:
    left:
      - text: "Guide"
        href: guide/getting-started.md
      - text: "Labs"
        href: labs/lab-01-transcribe-your-adder-overview.md
    right:
      - text: Course PDF
        icon: file-pdf
        href: dd102-course.pdf
      - icon: discord
        href: https://discord.gg/hrJnP5UsGz
        aria-label: Discord
      - icon: github
        href: https://github.com/uoftasic/dd102
        aria-label: GitHub
  sidebar:
    style: docked
    contents:
      - text: "Home"
        href: index.md
      - section: "1. Drawing to text"
        contents:
          - text: "Getting started"
            href: guide/getting-started.md
          - text: "From your drawing to a module"
            href: guide/from-your-drawing-to-a-module.md
          - text: "Modules and instances"
            href: guide/what-a-module-is.md
          - text: "`assign` and `always_comb`"
            href: guide/assign-and-always-comb.md
          - text: "Seeing your adder as a schematic"
            href: guide/seeing-it-come-back.md
          - text: "Lab 01: Transcribe your adder"
            href: labs/lab-01-transcribe-your-adder-overview.md
      - section: "2. Testing it"
        contents:
          - text: "Testbenches"
            href: guide/eight-rows-and-no-opinions.md
          - text: "Lab 02: Prove it"
            href: labs/lab-02-prove-it-overview.md
          - text: "Waveforms"
            href: guide/two-lines-make-the-waveform-appear.md
          - text: "Lab 03: The lazy testbench"
            href: labs/lab-03-the-lazy-testbench-overview.md
      - section: "3. More than one bit"
        contents:
          - text: "Vectors, generate loops and parameters"
            href: guide/four-adders-in-a-row.md
          - text: "Lab 04: Four adders in a row"
            href: labs/lab-04-four-adders-in-a-row-overview.md
      - section: "4. Onto the FPGA"
        contents:
          - text: "Carry delay"
            href: guide/the-carry-has-to-travel.md
          - text: "Inside an FPGA"
            href: guide/the-chip-is-already-there.md
          - text: "Lab 05: Onto the FPGA"
            href: labs/lab-05-onto-the-fpga-overview.md
      - section: "Reference"
        contents:
          - text: "The DD102 subset"
            href: reference/the-dd102-subset.md
          - text: "Reading a waveform"
            href: reference/reading-a-waveform.md
          - text: "Icarus error messages"
            href: reference/when-icarus-says-syntax-error.md
          - text: "The browser tools"
            href: reference/the-three-browser-tabs.md
          - text: "Expected results"
            href: reference/expected-results.md
      - section: "Repo"
        contents:
          - text: "Lab packages"
            href: https://github.com/uoftasic/dd102/tree/main/labs
          - text: "Scripts"
            href: https://github.com/uoftasic/dd102/tree/main/scripts

filters:
  - _filters/course.lua

# Collapsed answers move to the end of each page in PDFs; set this to
# "inline" to print them where they sit instead.
answers-in-pdf: end

format:
  html:
    theme:
      light: [cosmo, _light.scss]
      dark: [darkly, _dark.scss]
    css: _styles.css
    # Keeps old Docsify links (.../dd102/#/labs/...) working.
    include-in-header: _docsify-redirect.html
    toc: true
    toc-depth: 3
    code-copy: true
    lightbox: auto
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml-full.js"
    # Listing html first stops Quarto adding a second "Typst" link.
    format-links:
      - html
      - format: typst
        text: PDF
        icon: file-pdf
  typst:
    papersize: us-letter
    margin:
      x: 0.9in
      y: 0.9in
    fontsize: 10.5pt
    toc: false
